<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brightwave Supply status</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.5;
        color: #1f2933;
        background: #f5f7fa;
        margin: 0;
        padding: 24px 16px;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 24px;
        background: #ffffff;
        border: 1px solid #d9e2ec;
        border-radius: 8px;
      }
      h1 {
        font-size: 24px;
        line-height: 1.25;
        color: #102a43;
        margin: 0 0 16px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        vertical-align: top;
        padding: 10px 12px 10px 0;
        border-bottom: 1px solid #d9e2ec;
      }
      td:last-child {
        overflow-wrap: anywhere;
      }
      th {
        font-size: 14px;
        color: #52606d;
      }
      .pill {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
      }
      .ok {
        color: #0b5a23;
        background: #d3f9d8;
      }
      .degraded {
        color: #664d03;
        background: #fff3bf;
      }
      footer {
        margin-top: 16px;
        color: #52606d;
      }
      a {
        color: #0b5cad;
      }
      @media (max-width: 480px) {
        body {
          padding: 12px 8px;
        }
        main {
          padding: 16px 12px;
        }
        th,
        td {
          padding-right: 8px;
          font-size: 14px;
        }
        .pill {
          padding: 2px 8px;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Brightwave Supply status</h1>
      <table>
        <thead>
          <tr>
            <th>Service</th>
            <th>State</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Orders API</td>
            <td><span class="pill ok">Operational</span></td>
            <td>Accepting orders.</td>
          </tr>
          <tr>
            <td>Invoicing</td>
            <td><span class="pill ok">Operational</span></td>
            <td>Invoices are issued when an order is confirmed.</td>
          </tr>
          <tr>
            <td>Payment links</td>
            <td><span class="pill degraded">Degraded</span></td>
            <td>Links from billing.brightwave.internal may load slowly.</td>
          </tr>
        </tbody>
      </table>
      <footer>Questions? Write to <a href="mailto:support@brightwave-supply.com">support@brightwave-supply.com</a>.</footer>
    </main>
  </body>
</html>
